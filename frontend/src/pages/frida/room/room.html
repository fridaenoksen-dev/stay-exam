<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/pages/frida/room/room.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <title>Rom</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo-container">
          <a href="index.html">
            <img
              src="/src/assets/images/stayLogo.png"
              class="logo"
              alt="Stay Logo"
            />
          </a>
        </div>

        <div class="nav-guest">
          <a href="/index.html">Romliste</a>
          <a href="/booking.html">Mine bookinger</a>
          <a href="/login.html" class="btn-primary">Logg inn</a>
        </div>
      </nav>
    </header>
    <main class="container">
      <section class="room-section">
        <div class="room-hero">
          <div class="gallery">
            <div class="gallery-hero">
              <img
                src="/src/assets/images/rom1/dobbeltromSjoutsikt.png"
                alt="Romnavn"
              />

              <div class="gallery-thumbs">
                <img
                  src="/src/assets/images/rom1/rombilde1.png"
                  alt="Rombilde 1"
                  class="thumb"
                />
                <img
                  src="/src/assets/images/rom1/rombilde2.png"
                  alt="Rombilde 2"
                  class="thumb"
                />
                <img
                  src="/src/assets/images/rom1/rombilde3.png"
                  alt="Rombilde 3"
                  class="thumb"
                />
              </div>
            </div>
          </div>

          <aside class="room-card">
            <div class="roomcard-heading">
              <h1 class="room-title">Dobbeltrom med sjøutsikt</h1>
              <div class="room-rating" aria-label="4.5 av 5 stjerner">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half"></i>
              </div>
            </div>

            <div class="room-description" id="description">
              <p>Romslig dobbeltrom med utsikt mot havet.</p>
            </div>

            <div class="roomcard-bottom">
              <div class="features" id="features">
                <span class="feature">Dobbeltseng</span>
                <span class="feature">Eget bad</span>
                <span class="feature">Frokost inkludert</span>
              </div>

              <div class="room-price">
                <span class="price-label">Pris per natt</span>
                <span class="price" id="pricePrNight">kr 1 899 NOK</span>
              </div>
            </div>
            <hr class="divider" />

            <form class="booking-form">
              <label class="form-label" for="check-in">Innsjekk</label>
              <input type="date" id="check-in" name="check-in" required />

              <label class="form-label" for="check-out">Utsjekk</label>
              <input type="date" id="check-out" name="check-out" required />

              <label class="form-label">Antall gjester</label>
              <input
                type="number"
                id="guestCount"
                min="1"
                max="2"
                value="1"
                required
              />

              <label class="form-label"
                >Har du noen ønsker eller behov? (valgfritt)</label
              >
              <textarea
                id="message"
                name="comment"
                rows="4"
                placeholder="F.eks. sen innsjekk, allergier eller andre ønsker..."
              ></textarea>

              <button type="submit" class="btn-primary btn-book">
                Book nå
              </button>
            </form>
          </aside>
        </div>
      </section>
      <section class="reviews">
        <div class="reviews-header">
          <h2>Anmeldelser</h2>
          <button class="btn-primary" id="btn-new-review">
            <i class="fa-regular fa-pen-to-square"></i> Skriv anmeldelse
          </button>
        </div>

        <div class="review-list" id="review-list"></div>
      </section>
    </main>
    <footer>
      <p>© 2026 Stay - Bed and Breakfast</p>
    </footer>
    <div id="review-overlay" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2>Skriv anmeldelse</h2>
        <form id="review-form">
          <input type="hidden" id="review-id" />
          <div class="form-group">
            <label for="review-rating">Stjerner (1-5)</label>
            <input type="number" id="review-rating" min="1" max="5" required />
          </div>
          <div class="form-group">
            <label for="review-comment">Kommentar</label>
            <textarea
              id="review-comment"
              placeholder="Fortell om oppholdet ditt..."
            ></textarea>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Lagre</button>
            <button type="button" class="btn-secondary" id="btn-review-cancel">
              Avbryt
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/pages/frida/room/room.ts"></script>
  </body>
</html>
